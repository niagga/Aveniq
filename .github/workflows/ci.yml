name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: aveniq
          POSTGRES_PASSWORD: aveniq_dev
          POSTGRES_DB: aveniq
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aveniq -d aveniq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The isolation test builds a scratch database, applies the real migrations
      # and asserts what each tenant can see. It needs both connections: the
      # migrator creates and seeds, the application role proves the enforcement.
      TEST_DATABASE_URL: postgres://aveniq:aveniq_dev@127.0.0.1:5432/aveniq?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://aveniq_app:aveniq_app_dev@127.0.0.1:5432/aveniq?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: Backend/go.mod
          cache-dependency-path: Backend/go.sum

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      # Row-level security is ignored by superusers and BYPASSRLS roles, so the
      # application must connect as a role that is neither. Migration 0003 grants
      # it the privileges; the login and password belong to the environment.
      - name: Create the application role
        run: |
          PGPASSWORD=aveniq_dev psql -h 127.0.0.1 -U aveniq -d aveniq -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'aveniq_app') THEN CREATE ROLE aveniq_app NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE; END IF; ALTER ROLE aveniq_app LOGIN PASSWORD 'aveniq_app_dev'; END \$\$;"

      - name: Fail if generated queries are stale
        run: |
          sqlc generate
          git diff --exit-code -- internal/infrastructure/postgres/sqlcgen

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      # The pnpm version is not repeated here: the action reads `packageManager`
      # from a package.json, and by default it looks for one at the repository
      # root. This repository is a monorepo whose only package.json lives in
      # Frontend/, so the path has to be given explicitly. Hardcoding `version`
      # instead would let the workflow drift from the pinned toolchain.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
