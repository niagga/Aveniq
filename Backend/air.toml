# air.toml — live reload for the API during development.
# Install: go install github.com/air-verse/air@latest
# Run:     air
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api.exe ./cmd/api"
  bin = "tmp/api.exe"
  full_bin = ""
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "internal/infrastructure/postgres/sqlcgen"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
